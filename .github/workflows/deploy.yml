name: CI/CD - Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Chạy toàn bộ unit test
  # ─────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────
  # JOB 2: Build và deploy
  # ─────────────────────────────────────────
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - name: Build Docker image
        run: docker build -t auction-server:latest .

      - name: Save Docker image as tarball
        run: docker save auction-server:latest | gzip > auction-server.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "auction-server.tar.gz"
          target: "/root/"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            docker load < /root/auction-server.tar.gz

            # Dừng và xóa container cũ nếu tồn tại (bất kể trạng thái)
            docker stop auction-server --time=5 2>/dev/null || true
            docker rm -f auction-server 2>/dev/null || true

            # Đợi port 2501 được giải phóng hẳn
            for i in $(seq 1 10); do
              if ! ss -tlnp | grep -q ':2501'; then
                echo "Port 2501 đã sẵn sàng"
                break
              fi
              echo "Chờ port 2501 giải phóng... ($i/10)"
              sleep 1
            done

            # Tạo và start container mới
            docker run -d \
              --name auction-server \
              --restart unless-stopped \
              -p 2501:2501 \
              auction-server:latest

            # Xác nhận container đang chạy
            sleep 2
            if docker ps | grep -q auction-server; then
              echo "Deploy thành công! Container đang chạy."
            else
              echo "Deploy thất bại! Container không start được."
              docker logs auction-server --tail=20
              exit 1
            fi

            rm /root/auction-server.tar.gz
            docker image prune -f
            echo "Done!"