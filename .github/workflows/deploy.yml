name: Build & Deploy Auction Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build với Maven
        run: mvn clean package -DskipTests=true --batch-mode

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: auction-server
          path: target/*.jar
          retention-days: 1

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: auction-server
          path: ./target

      - name: Stop server cũ
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ -f /app/auction/server.pid ]; then
              PID=$(cat /app/auction/server.pid)
              if kill -0 $PID 2>/dev/null; then
                echo "Stopping old server (PID=$PID)..."
                kill $PID
                sleep 3
              fi
            fi

      - name: Copy JAR lên VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "target/*.jar"
          target: "/app/auction/"
          strip_components: 1

      - name: Start server mới
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /app/auction
            JAR=$(ls -t *.jar | grep -v bak | head -1)
            echo "Starting $JAR..."
            nohup java -jar $JAR > /app/auction/server.log 2>&1 &
            echo $! > /app/auction/server.pid
            sleep 5
            if kill -0 $(cat /app/auction/server.pid) 2>/dev/null; then
              echo "Server started successfully (PID=$(cat /app/auction/server.pid))"
            else
              echo "Server failed to start. Last 20 lines of log:"
              tail -20 /app/auction/server.log
              exit 1
            fi