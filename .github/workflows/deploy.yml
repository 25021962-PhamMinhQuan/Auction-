name: CI/CD - Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Chạy toàn bộ unit test
  # ─────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test

      # Upload kết quả test để xem trên GitHub Actions UI
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────
  # JOB 2: Build và deploy — chỉ chạy khi:
  #   • test pass
  #   • đang ở nhánh main (không chạy cho PR)
  # ─────────────────────────────────────────
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (skip tests — đã chạy ở job trước)
        run: mvn -B clean package -DskipTests

      - name: Build Docker image
        run: docker build -t auction-server:latest .

      - name: Save Docker image as tarball
        run: docker save auction-server:latest | gzip > auction-server.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "auction-server.tar.gz"
          target: "/root/"

      - name: Deploy on VPS (zero-downtime)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker load < /root/auction-server.tar.gz

            docker run -d \
              --name auction-server-new \
              --restart unless-stopped \
              -p 2501:2501 \
              auction-server:latest

            for i in $(seq 1 15); do
              if docker exec auction-server-new echo ok > /dev/null 2>&1; then
                echo "Container mới sẵn sàng"
                break
              fi
              sleep 1
            done

            docker stop auction-server --time=5 || true
            docker rm auction-server || true
            docker rename auction-server-new auction-server

            rm /root/auction-server.tar.gz
            docker image prune -f
            echo "Deploy xong!"