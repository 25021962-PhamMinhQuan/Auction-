name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      # Build the Docker image on the CI runner, not on the VPS
      - name: Build Docker image
        run: docker build -t auction-server:latest .

      - name: Save Docker image as tarball
        run: docker save auction-server:latest | gzip > auction-server.tar.gz

      # Ship the ready-made image, not raw build artifacts
      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "auction-server.tar.gz"
          target: "/root/"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker stop auction-server || true
            docker rm auction-server || true
            docker load < /root/auction-server.tar.gz
            docker run -d \
              --name auction-server \
              --restart unless-stopped \
              -p 2501:2501 \
              auction-server:latest
            rm /root/auction-server.tar.gz
            echo "Deploy xong!"